import dex.plugins.outlet.v2.util.ReleaseType

plugins {
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
	id 'net.neoforged.moddev' version "2.0.+"
	id 'xyz.jpenilla.resource-factory-neoforge-convention' version "1.3.1"
	id 'io.github.dexman545.outlet' version "1.7.0-alpha.5"
}

base {
	archivesName = "${project.mod_id}-neoforge"
	version = project.mod_version
}

ext.neo_mod_id = project.mod_id.replace('-', '_');

neoForgeModsToml {
	issueTrackerUrl = rootProject.mod_issues
	mod(rootProject.neo_mod_id) {
		setLicense("LGPLv3")
		version = project.version
		displayName = rootProject.mod_name
		description = rootProject.mod_description
		authors = "Patbox"
		logoFile = "assets/${rootProject.mod_id}/icon.png"
		logoBlur = false
		features = ["javaVersion": "[25,)"]
		modUrl = rootProject.mod_sources
		displayUrl = rootProject.mod_website
		dependencies {
			required("minecraft",  project.minecraft_version_range)
		}
	}
}
outlet {
	mcVersionRange = project.supported_minecraft_versions
	allowedReleaseTypes = Set.of(ReleaseType.RELEASE)
}

repositories {
	maven { url = "https://maven.nucleoid.xyz" }
	maven { url = "https://jitpack.io" }
}

sourceSets {
	testmod {
		runtimeClasspath += main.runtimeClasspath
		compileClasspath += main.compileClasspath
	}
}

dependencies {
	testmodImplementation sourceSets.main.output
}

neoForge {
	version = project.neoforge_version

	mods {
		"${project.neo_mod_id}" {
			sourceSet(sourceSets.main)
		}
		"testmod" {
			sourceSet(sourceSets.testmod)
		}
	}

	runs {
		testmodClient {
			client()
			ideName = "Test Mod Client"
			sourceSet = sourceSets.testmod
		}

		testmodServer {
			server()
			ideName = "Test Mod Server"
			sourceSet = sourceSets.testmod
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.INFO
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName}"}
	}
}

def env = System.getenv()

// configure the maven publication
publishing {
	repositories {
		maven {
			name = "OffsetMonkey538"
			url = "https://maven.offsetmonkey538.top/releases"
			credentials {
				username = providers.gradleProperty("OffsetMonkey538Username").getOrElse(System.getenv("MAVEN_USERNAME"))
				password = providers.gradleProperty("OffsetMonkey538Password").getOrElse(System.getenv("MAVEN_PASSWORD"))
			}
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
	publications {
		register("maven", MavenPublication) {
			afterEvaluate {
				artifactId base.archivesName.get()
			}
			groupId "eu.pb4"
			from components.java
		}
	}
}

modrinth {
	debugMode = Boolean.parseBoolean(System.getenv("MODRINTH_DEBUG"))

	// Main properties
	token = System.getenv("MODRINTH_TOKEN")
	projectId = rootProject.mod_id
	gameVersions = outlet.mcVersions()


	// Version stuff
	def customVersionName = System.getenv("VERSION_NAME")
	if (customVersionName != null) versionName = customVersionName

	versionNumber = "${project.version}"

	def isPreRelease = System.getenv("VERSION_IS_PRERELEASE")
	versionType = Boolean.parseBoolean(isPreRelease) ? "beta" : "release"

	if (project.mod_version.contains("beta")) versionType = "beta"
	if (project.mod_version.contains("alpha")) versionType = "alpha"


	// Files
	additionalFiles = [sourcesJar]


	// Project info
	def changelogEnv = System.getenv("VERSION_CHANGELOG")
	if (changelogEnv != null) changelog = changelogEnv

	autoAddDependsOn = false
}
